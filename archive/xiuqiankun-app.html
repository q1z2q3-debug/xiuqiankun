<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>袖里乾坤 · 小六壬</title>
<style>
  :root{
    --paper:#F7F2E7;
    --paper-deep:#EFE7D4;
    --ink:#2B2B2B;
    --ink-soft:#6B645A;
    --cinnabar:#B03A2E;
    --cinnabar-deep:#8F2E24;
    --gold:#B98A4A;
    --card:#FCFAF3;
    --line:rgba(43,43,43,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    background:#D8D2C2;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100%;
  }
  /* ============ 通用手机预览壳 ============ */
  [data-design-suite-app-preview-shell]{
    width:430px;max-width:100%;height:920px;max-height:96vh;
    background:#171512;
    border-radius:44px;
    padding:12px;
    box-shadow:0 30px 70px rgba(30,24,16,.45), inset 0 0 0 2px rgba(255,255,255,.08);
    position:relative;
    transition:width .3s ease;
  }
  [data-design-suite-app-preview-viewport]{
    width:100%;height:100%;
    background:var(--paper);
    border-radius:34px;
    overflow:hidden;
    position:relative;
    display:flex;flex-direction:column;
  }
  .app-screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain}
  .app-screen::-webkit-scrollbar{width:0}
  @media (max-width:767px){
    body{display:block}
    [data-design-suite-app-preview-shell]{
      width:min(430px,100%);height:100vh;max-height:none;border-radius:0;
      padding:0;box-shadow:none;
    }
    [data-design-suite-app-preview-viewport]{border-radius:0}
  }
  /* 状态栏 */
  .statusbar{
    height:44px;flex:0 0 44px;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 8px;
    font-size:12.5px;letter-spacing:.5px;
    color:var(--ink);font-weight:600;
  }
  .statusbar .sb-icons{display:flex;align-items:center;gap:6px}
  .statusbar svg{display:block}
  /* 手势条 */
  .gesturebar{
    height:26px;flex:0 0 26px;
    display:flex;align-items:center;justify-content:center;
  }
  .gesturebar i{width:120px;height:5px;border-radius:99px;background:rgba(43,43,43,.35)}
  /* ============ 首页 ============ */
  .view{display:none;min-height:100%}
  .view.active{display:block;animation:fadeIn .45s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hero-wrap{padding:10px 20px 0}
  .hero-img{
    width:100%;height:212px;object-fit:cover;
    border-radius:20px 20px 8px 8px;
    border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(90,70,40,.12);
  }
  .brand{margin:18px 22px 2px;display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{
    font-size:30px;font-weight:700;letter-spacing:8px;
    color:var(--ink);
  }
  .brand .seal{
    font-size:11px;color:var(--cinnabar);
    border:1.5px solid var(--cinnabar);
    padding:4px 7px;border-radius:4px;letter-spacing:2px;
    transform:rotate(-2deg);
  }
  .subtitle{margin:6px 22px 0;font-size:13px;color:var(--ink-soft);letter-spacing:3px}
  /* 掌图 */
  .palm-stage{margin:14px 20px 4px;position:relative}
  .palm-frame{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:10px 8px 4px;
    box-shadow:0 6px 18px rgba(90,70,40,.07);
  }
  .palm-frame svg{width:100%;height:auto;display:block}
  .palm-badge{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    font-size:11px;color:var(--ink-soft);letter-spacing:4px;
    background:rgba(247,242,231,.9);padding:3px 12px;border-radius:99px;
    border:1px solid var(--line);
  }
  /* 六宫速览 */
  .six-chip{
    margin:12px 20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  }
  .chip{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:8px 4px;text-align:center;font-size:12.5px;letter-spacing:2px;
  }
  .chip b{display:block;font-size:14px;letter-spacing:2px;font-weight:700}
  .chip .g{color:var(--cinnabar)}
  .chip .b{color:var(--ink-soft)}
  .chip small{display:block;margin-top:2px;color:var(--ink-soft);font-size:10.5px;letter-spacing:1px}
  /* 按钮 */
  .actions{margin:18px 20px 8px;display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:52px;border:none;border-radius:16px;
    font-family:inherit;font-size:16.5px;letter-spacing:5px;font-weight:600;
    cursor:pointer;transition:transform .12s ease, box-shadow .2s ease;
    width:100%;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{
    background:var(--cinnabar);color:#FBF4E8;
    box-shadow:0 10px 22px rgba(176,58,46,.32);
  }
  .btn-ghost{
    background:transparent;color:var(--ink);
    border:1.5px solid var(--ink);
  }
  .hint{
    margin:14px 30px 0;text-align:center;
    font-size:12px;color:var(--ink-soft);line-height:1.9;letter-spacing:1.5px;
  }
  .disclaimer{
    margin:10px 24px 18px;text-align:center;
    font-size:10.5px;color:var(--ink-soft);opacity:.75;line-height:1.7;
  }
  /* ============ 掐指动画 ============ */
  .cast-stage{padding:22px 20px 0;text-align:center}
  .cast-title{font-size:20px;letter-spacing:8px;font-weight:700}
  .cast-step{
    margin-top:10px;font-size:13px;color:var(--ink-soft);letter-spacing:2px;
    min-height:20px;
  }
  .cast-palm{
    margin:18px auto 0;max-width:300px;
    position:relative;
  }
  .cast-palm svg{width:100%;height:auto;display:block}
  .running-lite{
    margin:20px auto;
    width:190px;height:3px;border-radius:99px;background:rgba(43,43,43,.12);overflow:hidden;
  }
  .running-lite i{
    display:block;height:100%;width:40%;
    background:var(--cinnabar);
    border-radius:99px;
    animation:run 1.1s ease-in-out infinite;
  }
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  .cast-result-note{margin-top:18px;font-size:12px;color:var(--ink-soft);letter-spacing:1px}
  /* ============ 结果页 ============ */
  .result-head{text-align:center;padding:24px 20px 6px}
  .result-tags{font-size:12px;color:var(--ink-soft);letter-spacing:2px}
  .result-name{
    margin-top:8px;font-size:44px;font-weight:700;letter-spacing:14px;
    text-indent:14px;
  }
  .luck-badge{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:12px;padding:7px 18px;border-radius:99px;
    font-size:14px;letter-spacing:4px;font-weight:700;
  }
  .luck-good{background:var(--cinnabar);color:#FBF4E8;box-shadow:0 8px 18px rgba(176,58,46,.28)}
  .luck-bad{background:var(--ink);color:#F2EADA;box-shadow:0 8px 18px rgba(43,43,43,.25)}
  .luck-mid{background:var(--gold);color:#3A2E18}
  .cast-info{
    margin:16px 20px 0;text-align:center;font-size:12px;color:var(--ink-soft);letter-spacing:1.5px;line-height:1.9;
  }
  .card{
    margin:14px 20px 0;background:var(--card);
    border:1px solid var(--line);border-radius:18px;
    padding:16px 18px;
  }
  .card h3{
    font-size:14px;letter-spacing:4px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .card h3::before{content:"";width:4px;height:14px;background:var(--cinnabar);border-radius:2px;display:inline-block}
  .attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .attr{text-align:center}
  .attr .k{font-size:11px;color:var(--ink-soft);letter-spacing:2px}
  .attr .v{margin-top:4px;font-size:15px;font-weight:700;letter-spacing:2px}
  .gongue{margin-top:14px;font-size:15px;line-height:2.15;letter-spacing:2.5px;color:var(--ink)}
  .gongue .zl{color:var(--cinnabar);letter-spacing:4px;font-weight:700}
  .plain-text{margin-top:12px;font-size:13.5px;line-height:2;color:var(--ink-soft)}
  /* 分项手风琴 */
  .items{margin:14px 20px 0;display:flex;flex-direction:column;gap:9px}
  .item{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
  .item-head{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:13px 16px;background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:14px;letter-spacing:3px;font-weight:600;color:var(--ink);
    text-align:left;
  }
  .item-head .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 26px}
  .ic-good{background:rgba(176,58,46,.12);color:var(--cinnabar)}
  .ic-bad{background:rgba(43,43,43,.08);color:var(--ink-soft)}
  .item-head .arrow{margin-left:auto;transition:transform .25s ease;color:var(--ink-soft);font-size:12px}
  .item.open .arrow{transform:rotate(180deg)}
  .item-body{display:none;padding:2px 16px 15px;font-size:13px;line-height:2;color:var(--ink-soft)}
  .item.open .item-body{display:block;animation:fadeIn .3s ease}
  .item-body .advice{margin-top:8px;color:var(--cinnabar-deep)}
  .item-body .advice::before{content:"宜 · "}
  /* 底部行动 */
  .result-foot{padding:18px 20px 26px;display:flex;flex-direction:column;gap:12px}
  .recast{
    width:100%;min-height:52px;border-radius:16px;
    background:transparent;border:1.5px solid var(--ink);
    font-family:inherit;font-size:16px;letter-spacing:5px;font-weight:600;color:var(--ink);
    cursor:pointer;
  }
  /* 顶部信息条（结果页返回） */
  .appbar{
    height:52px;flex:0 0 52px;
    display:flex;align-items:center;gap:10px;
    padding:0 18px;border-bottom:1px solid var(--line);
    background:rgba(247,242,231,.92);
    backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:5;
  }
  .appbar .back{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
  }
  .appbar .t{font-size:13px;letter-spacing:3px;color:var(--ink-soft)}
  /* ============ 择时弹层 ============ */
  .sheet-mask{
    position:absolute;inset:0;background:rgba(30,24,16,.45);z-index:20;
    display:none;align-items:flex-end;
  }
  .sheet-mask.open{display:flex;animation:fadeIn .25s ease}
  .sheet{
    width:100%;background:var(--paper);border-radius:26px 26px 0 0;
    padding:18px 20px calc(22px + env(safe-area-inset-bottom));
    animation:slideUp .3s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideUp{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{font-size:16px;letter-spacing:4px;text-align:center}
  .sheet-sub{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:6px;letter-spacing:1px}
  .picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
  .picker label{font-size:11px;color:var(--ink-soft);letter-spacing:1px;text-align:center}
  .picker select{
    width:100%;margin-top:6px;padding:10px 4px;text-align:center;
    border:1px solid var(--line);border-radius:12px;background:var(--card);
    font-family:inherit;font-size:14px;color:var(--ink);appearance:none;
  }
  .lunar-preview{
    margin-top:16px;text-align:center;font-size:13.5px;color:var(--ink);
    letter-spacing:2px;background:var(--card);border:1px dashed var(--line);
    border-radius:14px;padding:12px;
  }
  .lunar-preview b{color:var(--cinnabar);font-weight:700}
  .sheet .btn{margin-top:16px}
  .sheet .cancel{
    margin-top:10px;width:100%;background:none;border:none;
    font-family:inherit;font-size:13px;letter-spacing:3px;color:var(--ink-soft);
    cursor:pointer;padding:10px;
  }
  /* 水墨微纹理 */
  .ink-veil{position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(185,138,74,.10) 0, transparent 32%),
      radial-gradient(circle at 88% 30%, rgba(43,43,43,.05) 0, transparent 28%),
      radial-gradient(circle at 20% 80%, rgba(176,58,46,.05) 0, transparent 30%);
  }
  .gezi{
    background-image:repeating-linear-gradient(0deg, transparent 0 25px, rgba(43,43,43,.035) 25px 26px),
    repeating-linear-gradient(90deg, transparent 0 25px, rgba(43,43,43,.035) 25px 26px);
  }
  .view > *{position:relative;z-index:1}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>

  function lYearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1){sum+=(lunarInfo[y-1900]&i)?1:0;}return sum+leapDays(y);}
  function leapMonth(y){return lunarInfo[y-1900]&0xf;}
  function leapDays(y){if(leapMonth(y)){return (lunarInfo[y-1900]&0x10000)?30:29;}return 0;}
  function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
  function solar2lunar(y,m,d){
    var baseDate=new Date(1900,0,31);
    var objDate=new Date(y,m-1,d);
    var offset=Math.round((objDate.getTime()-baseDate.getTime())/86400000);
    var i,temp=0;
    for(i=1900;i<2050&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
    if(offset<0){offset+=temp;i--;}
    var year=i;
    var leap=leapMonth(i);
    var isLeap=false;
    for(i=1;i<13&&offset>0;i++){
      if(leap>0&&i===(leap+1)&&!isLeap){--i;isLeap=true;temp=leapDays(year);}
      else{temp=monthDays(year,i);}
      if(isLeap&&i===(leap+1)){isLeap=false;}
      offset-=temp;
    }
    if(offset===0&&leap>0&&i===leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}
    if(offset<0){offset+=temp;--i;}
    return {year:year,month:i,day:offset+1,isLeap:isLeap};
  }

    var dPos=(mPos+day-1)%6;
    for(i=0;i<6;i++){seq.push({p:(mPos+i)%6,step:PALACES[mPos].name+'起初一 · 数至'+NUM_CN[day]+'日'});}
    seq.push({p:dPos,step:'日落 '+PALACES[dPos].name});
    /* 阶段三：日上起时，数至时辰 */
    for(i=0;i<6;i++){seq.push({p:(dPos+i)%6,step:PALACES[dPos].name+'起子时 · 数至'+HOUR_CN[hourIdx]});}
    seq.push({p:finalIdx,step:'时落 '+PALACES[finalIdx].name+' · 卦成'});

    document.getElementById('palmCast').innerHTML=palmSvg(-1);
    var stepEl=document.getElementById('castStep');
    var noteEl=document.getElementById('castNote');

    var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced||seq.length===0){
      finishCast(finalIdx,month,day,hourIdx);
      return;
    }
    showView('cast');
    var idx=0;
    function step(){
      if(idx>=seq.length){finishCast(finalIdx,month,day,hourIdx);return;}
      var s=seq[idx];
      document.getElementById('palmCast').innerHTML=palmSvg(s.p);
      stepEl.textContent=s.step;
      noteEl.textContent='掐指之间，六宫流转';
      idx++;
      castTimer=setTimeout(step,150);
    }
    castTimer=setTimeout(step,320);
  }
  function finishCast(finalIdx,month,day,hourIdx){
    if(castTimer){clearTimeout(castTimer);}
    var p=PALACES[finalIdx];
    document.getElementById('palmCast').innerHTML=palmSvg(finalIdx);
    document.getElementById('castStep').textContent='落定 · '+p.name;
    document.getElementById('castNote').textContent=p.pos+' · '+p.attr+' · '+p.luck;
    setTimeout(function(){
      renderResult(finalIdx,month,day,hourIdx);
    },1150);
  }

  /* ================= 结果页渲染 ================= */
  function renderResult(idx,month,day,hourIdx){
    var p=PALACES[idx];
    document.getElementById('rMeta').textContent=p.attr+' · 居'+p.dir;
    document.getElementById('rName').textContent=p.name;
    var luck=document.getElementById('rLuck');
    var map={good:['吉', 'luck-good'],mid:['迟滞', 'luck-mid'],bad:['凶', 'luck-bad'],};
    luck.textContent=p.luck+' · 谋事主'+p.num;
    luck.className='luck-badge '+map[p.tone][1];
    document.getElementById('rTimeInfo').textContent='农历'+month+'月（'+MONTH_CN[month]+'）'+NUM_CN[day]+'日 · '+HOUR_CN[hourIdx]+'（'+HOUR_RANGE[hourIdx]+'）起卦';

    var attrs='';
    [['五行',p.attr.split(' · ')[0]],['六神',p.attr.split(' · ')[1]],['方位',p.dir],['指位',p.pos]].forEach(function(a){
      attrs+='<div class="attr"><div class="k">'+a[0]+'</div><div class="v">'+a[1]+'</div></div>';
    });
    document.getElementById('rAttrs').innerHTML=attrs;
    document.getElementById('rGongue').innerHTML=p.gongue.replace(/\n/g,'<br>');
    document.getElementById('rPlain').textContent=p.plain;
    document.getElementById('rAdvice').textContent=p.advice;

    var items='';
    p.items.forEach(function(it,ii){
      var iconCls=it.ic==='g'?'ic-good':'ic-bad';
      items+='<div class="item" data-i="'+ii+'">'
        +'<button class="item-head" aria-expanded="false"><span class="ic '+iconCls+'">'+(it.ic==='g'?'吉':'慎')+'</span>'+it.k+'<span class="arrow">▾</span></button>'
        +'<div class="item-body"><div>'+it.t+'</div><div class="advice">'+it.a+'</div></div>'
        +'</div>';
    });
    document.getElementById('rItems').innerHTML=items;
    document.querySelectorAll('.item-head').forEach(function(btn){
      btn.addEventListener('click',function(){
        var item=btn.parentNode;
        var open=item.classList.toggle('open');
        btn.setAttribute('aria-expanded',open?'true':'false');
      });
    });

    showView('result');
  }

  /* ================= 择时弹层 ================= */
  function fillPickers(){
    var now=new Date();
    var ySel=document.getElementById('selYear');
    var yHtml='';
    for(var y=2026;y>=1940;y--){yHtml+='<option value="'+y+'">'+y+'年</option>';}
    ySel.innerHTML=yHtml;
    ySel.value=now.getFullYear();
    var mHtml='';
    for(var m=1;m<=12;m++){mHtml+='<option value="'+m+'">'+m+'月</option>';}
    document.getElementById('selMonth').innerHTML=mHtml;
    document.getElementById('selMonth').value=now.getMonth()+1;
    var dHtml='';
    for(var d=1;d<=31;d++){dHtml+='<option value="'+d+'">'+d+'日</option>';}
    document.getElementById('selDay').innerHTML=dHtml;
    document.getElementById('selDay').value=now.getDate();
    var hHtml='';
    for(var h=0;h<12;h++){hHtml+='<option value="'+h+'">'+HOUR_CN[h]+'（'+HOUR_RANGE[h]+'）</option>';}
    document.getElementById('selHour').innerHTML=hHtml;
    document.getElementById('selHour').value=hourIndex(now.getHours());
    updateLunarPreview();
  }
  function readPicker(){
    return {
      y:parseInt(document.getElementById('selYear').value,10),
      m:parseInt(document.getElementById('selMonth').value,10),
      d:parseInt(document.getElementById('selDay').value,10),
      h:parseInt(document.getElementById('selHour').value,10)
    };
  }
  function updateLunarPreview(){
    var v=readPicker();
    var maxDay=new Date(v.y,v.m,0).getDate();
    var daySel=document.getElementById('selDay');
    var cur=parseInt(daySel.value,10);
    if(cur>maxDay){daySel.value=maxDay;v.d=maxDay;}
    var lunar=solar2lunar(v.y,v.m,v.d);
    document.getElementById('lunarPreview').innerHTML='换算农历：<b>'+lunar.year+'年 '+(lunar.isLeap?'闰':'')+MONTH_CN[lunar.month]+NUM_CN[lunar.day]+'</b> · '+HOUR_CN[v.h]+' → 三数 '+lunar.month+' / '+lunar.day+' / '+(v.h+1);
    return lunar;
  }

  /* ================= 事件绑定 ================= */
  function bind(){
    document.getElementById('btnImmediate').addEventListener('click',function(){
      var now=new Date();
      var lunar=solar2lunar(now.getFullYear(),now.getMonth()+1,now.getDate());
      runCasting(lunar.month,lunar.day,hourIndex(now.getHours()));
    });
    document.getElementById('btnPickTime').addEventListener('click',function(){
      document.getElementById('sheetMask').classList.add('open');
    });
    document.getElementById('btnCancelSheet').addEventListener('click',function(){
      document.getElementById('sheetMask').classList.remove('open');
    });
    document.getElementById('sheetMask').addEventListener('click',function(e){
      if(e.target===this){this.classList.remove('open');}
    });
    ['selYear','selMonth','selDay','selHour'].forEach(function(id){
      document.getElementById(id).addEventListener('change',updateLunarPreview);
    });
    document.getElementById('btnCastPick').addEventListener('click',function(){
      var v=readPicker();
      var lunar=solar2lunar(v.y,v.m,v.d);
      document.getElementById('sheetMask').classList.remove('open');
      runCasting(lunar.month,lunar.day,v.h);
    });
    document.getElementById('castBack').addEventListener('click',function(){
      if(castTimer){clearTimeout(castTimer);}
      showView('home');
    });
    document.getElementById('resultBack').addEventListener('click',function(){showView('home');});
    document.getElementById('btnRecast').addEventListener('click',function(){showView('home');});
  }

  /* 状态栏时间 */
  function tickTime(){
    var now=new Date();
    var hh=('0'+now.getHours()).slice(-2);
    var mm=('0'+now.getMinutes()).slice(-2);
    document.getElementById('sbTime').textContent=hh+':'+mm;
  }

  function init(){
    tickTime();setInterval(tickTime,30000);
    renderChips();
    renderHomePalm();
    fillPickers();
    bind();
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>
